<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CedarFix AI — Sign In</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    .auth-wrapper {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: var(--gray-100);
    }
    .auth-card {
      background: var(--white);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 40px 36px;
      width: 100%;
      max-width: 420px;
    }
    .auth-logo {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 28px;
      justify-content: center;
    }
    .auth-logo-icon { font-size: 32px; }
    .auth-logo-name { font-size: 20px; font-weight: 700; color: var(--green); }
    .auth-logo-sub  { font-size: 11px; color: var(--gray-600); }
    .tab-row {
      display: flex;
      border-bottom: 2px solid var(--gray-200);
      margin-bottom: 28px;
    }
    .tab-btn {
      flex: 1;
      background: none;
      border: none;
      padding: 10px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      color: var(--gray-600);
      border-bottom: 3px solid transparent;
      margin-bottom: -2px;
      transition: color 0.2s, border-color 0.2s;
    }
    .tab-btn.active {
      color: var(--green);
      border-bottom-color: var(--green);
    }
    .tab-panel { display: none; }
    .tab-panel.active { display: block; }
    .field { margin-bottom: 18px; }
    .field label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: var(--gray-800);
      margin-bottom: 6px;
    }
    .field input {
      width: 100%;
      padding: 11px 14px;
      border: 1.5px solid var(--gray-200);
      border-radius: 8px;
      font-size: 14px;
      transition: border-color 0.2s;
      outline: none;
    }
    .field input:focus { border-color: var(--green); }
    .role-row {
      display: flex;
      gap: 12px;
      margin-bottom: 18px;
    }
    .role-btn {
      flex: 1;
      padding: 10px;
      border: 2px solid var(--gray-200);
      border-radius: 8px;
      background: var(--white);
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      color: var(--gray-600);
    }
    .role-btn.selected {
      border-color: var(--green);
      background: var(--green-pale);
      color: var(--green);
    }
    .btn-auth {
      width: 100%;
      padding: 13px;
      background: var(--green);
      color: var(--white);
      border: none;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.2s;
      margin-top: 4px;
    }
    .btn-auth:hover { background: var(--green-mid); }
    .btn-auth:disabled { opacity: 0.6; cursor: not-allowed; }
    .auth-error {
      background: #fde8ea;
      color: var(--red);
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 13px;
      margin-bottom: 16px;
      display: none;
    }
    .auth-success {
      background: var(--green-pale);
      color: var(--green);
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 13px;
      margin-bottom: 16px;
      display: none;
    }
  </style>
</head>
<body>
  <div class="auth-wrapper">
    <div class="auth-card">
      <div class="auth-logo">
        <span class="auth-logo-icon">🌲</span>
        <div>
          <div class="auth-logo-name">CedarFix AI</div>
          <div class="auth-logo-sub">Lebanese Public Infrastructure Intelligence</div>
        </div>
      </div>

      <div class="tab-row">
        <button class="tab-btn active" id="tabLogin" onclick="switchTab('login')">Sign In</button>
        <button class="tab-btn" id="tabRegister" onclick="switchTab('register')">Register</button>
      </div>

      <!-- ── LOGIN ── -->
      <div class="tab-panel active" id="panelLogin">
        <div class="auth-error" id="loginError"></div>
        <div class="field">
          <label>Username</label>
          <input type="text" id="loginUsername" placeholder="Enter your username" autocomplete="username" />
        </div>
        <div class="field">
          <label>Password</label>
          <input type="password" id="loginPassword" placeholder="Enter your password" autocomplete="current-password" />
        </div>
        <button class="btn-auth" id="btnLogin" onclick="doLogin()">Sign In</button>
      </div>

      <!-- ── REGISTER ── -->
      <div class="tab-panel" id="panelRegister">
        <div class="auth-error" id="registerError"></div>
        <div class="auth-success" id="registerSuccess"></div>
        <div class="field">
          <label>Username</label>
          <input type="text" id="regUsername" placeholder="Choose a username (min 3 chars)" autocomplete="username" />
        </div>
        <div class="field">
          <label>Password</label>
          <input type="password" id="regPassword" placeholder="Choose a password (min 6 chars)" autocomplete="new-password" />
        </div>
        <div style="margin-bottom:18px">
          <label style="font-size:13px;font-weight:600;color:var(--gray-800);display:block;margin-bottom:8px">Account Type</label>
          <div class="role-row">
            <button class="role-btn selected" id="roleUser" onclick="selectRole('user')">👤 Citizen</button>
            <button class="role-btn" id="roleAdmin" onclick="selectRole('admin')">🛡️ Admin</button>
          </div>
        </div>
        <button class="btn-auth" id="btnRegister" onclick="doRegister()">Create Account</button>
      </div>
    </div>
  </div>

  <script>
    const GATEWAY = window.GATEWAY_URL || '/api';
    let selectedRole = 'user';

    function switchTab(tab) {
      document.getElementById('tabLogin').classList.toggle('active', tab === 'login');
      document.getElementById('tabRegister').classList.toggle('active', tab === 'register');
      document.getElementById('panelLogin').classList.toggle('active', tab === 'login');
      document.getElementById('panelRegister').classList.toggle('active', tab === 'register');
    }

    function selectRole(role) {
      selectedRole = role;
      document.getElementById('roleUser').classList.toggle('selected', role === 'user');
      document.getElementById('roleAdmin').classList.toggle('selected', role === 'admin');
    }

    function showError(id, msg) {
      const el = document.getElementById(id);
      el.textContent = msg;
      el.style.display = 'block';
    }
    function hideError(id) { document.getElementById(id).style.display = 'none'; }

    function saveAuth(data) {
      localStorage.setItem('cf_token', data.access_token);
      localStorage.setItem('cf_role', data.role);
      localStorage.setItem('cf_user_id', data.user_id);
      localStorage.setItem('cf_username', data.username);
    }

    async function doLogin() {
      hideError('loginError');
      const username = document.getElementById('loginUsername').value.trim();
      const password = document.getElementById('loginPassword').value;
      if (!username || !password) return showError('loginError', 'Please fill in all fields.');

      const btn = document.getElementById('btnLogin');
      btn.disabled = true;
      btn.textContent = 'Signing in…';
      try {
        const res = await fetch(`${GATEWAY}/auth/login`, {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({username, password}),
        });
        const data = await res.json();
        if (!res.ok) return showError('loginError', data.detail || 'Login failed.');
        saveAuth(data);
        window.location.href = data.role === 'admin' ? 'admin.html' : 'index.html';
      } catch (e) {
        showError('loginError', 'Cannot connect to server.');
      } finally {
        btn.disabled = false;
        btn.textContent = 'Sign In';
      }
    }

    async function doRegister() {
      hideError('registerError');
      document.getElementById('registerSuccess').style.display = 'none';
      const username = document.getElementById('regUsername').value.trim();
      const password = document.getElementById('regPassword').value;
      if (!username || !password) return showError('registerError', 'Please fill in all fields.');
      if (username.length < 3) return showError('registerError', 'Username must be at least 3 characters.');
      if (password.length < 6) return showError('registerError', 'Password must be at least 6 characters.');

      const btn = document.getElementById('btnRegister');
      btn.disabled = true;
      btn.textContent = 'Creating account…';
      try {
        const res = await fetch(`${GATEWAY}/auth/register`, {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({username, password, role: selectedRole}),
        });
        const data = await res.json();
        if (!res.ok) return showError('registerError', data.detail || 'Registration failed.');
        saveAuth(data);
        window.location.href = data.role === 'admin' ? 'admin.html' : 'index.html';
      } catch (e) {
        showError('registerError', 'Cannot connect to server.');
      } finally {
        btn.disabled = false;
        btn.textContent = 'Create Account';
      }
    }

    // Allow Enter key on inputs
    document.addEventListener('keydown', (e) => {
      if (e.key !== 'Enter') return;
      const active = document.querySelector('.tab-panel.active').id;
      if (active === 'panelLogin') doLogin();
      else doRegister();
    });

    // If already logged in, redirect
    if (localStorage.getItem('cf_token')) {
      const role = localStorage.getItem('cf_role');
      window.location.href = role === 'admin' ? 'admin.html' : 'index.html';
    }
  </script>
</body>
</html>
