<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CedarFix AI — Track Complaint</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    .track-container { max-width: 640px; margin: 48px auto; padding: 0 24px; }
    .track-form { display: flex; gap: 12px; margin-bottom: 28px; }
    .track-form input { flex: 1; }
    .btn-track {
      padding: 12px 24px;
      background: var(--green);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
    }
    .btn-track:hover { background: var(--green-mid); }
    .track-result { display: none; }
    .pipeline-steps { list-style: none; display: flex; flex-direction: column; gap: 0; margin: 20px 0; }
    .pipeline-step {
      display: flex; align-items: flex-start; gap: 14px;
      padding: 14px 0;
      border-bottom: 1px solid var(--gray-200);
    }
    .pipeline-step:last-child { border-bottom: none; }
    .step-status { font-size: 20px; min-width: 28px; text-align: center; margin-top: 1px; }
    .step-info strong { display: block; font-size: 14px; margin-bottom: 3px; }
    .step-info span { font-size: 13px; color: var(--gray-600); }
  </style>
</head>
<body>

  <header class="header">
    <div class="header-inner">
      <div class="logo">
        <span class="logo-icon">🌲</span>
        <div>
          <span class="logo-name">CedarFix AI</span>
          <span class="logo-sub">Lebanese Public Infrastructure Intelligence</span>
        </div>
      </div>
      <nav class="header-links">
        <a href="index.html">Report Issue</a>
        <a href="track.html" class="active">My Complaints</a>
        <a id="adminLink" href="admin.html" style="display:none">Admin</a>
        <span id="headerUser" style="color:rgba(255,255,255,0.7);font-size:13px;padding:6px 8px"></span>
        <a href="#" onclick="logout()">Logout</a>
      </nav>
    </div>
  </header>

  <section class="hero">
    <h1>My Complaints</h1>
    <p>View all your submitted complaints and track their pipeline status.</p>
  </section>

  <main class="main">
    <div class="track-container" style="max-width:900px">

      <!-- ── My complaints list ── -->
      <div class="card" style="margin-bottom:24px" id="myComplaintsCard">
        <h2 class="section-title">Your Submissions</h2>
        <div id="myComplaintsList" style="margin-top:16px">
          <p style="color:var(--gray-600);font-size:14px">⏳ Loading your complaints…</p>
        </div>
      </div>

      <!-- ── Lookup by ID ── -->
      <div class="card">
        <h2 class="section-title">Lookup by Complaint ID</h2>
        <div class="track-form">
          <input type="text" id="trackId" placeholder="Complaint ID (e.g. a3f7c2d1-...)" />
          <button class="btn-track" id="trackBtn">Look up</button>
        </div>
        <div class="track-result card" id="trackResult" style="background:var(--gray-100);display:none">
          <div id="trackContent"></div>
        </div>
      </div>
    </div>
  </main>

  <div class="ticker-bar" id="tickerBar">
    <span class="ticker-label">Recent</span>
    <div class="ticker-track" id="tickerTrack">Loading...</div>
  </div>

  <script src="app.js"></script>
  <script>
    const GATEWAY = window.GATEWAY_URL || '/api';
    const cfToken = localStorage.getItem('cf_token');
    const cfRole  = localStorage.getItem('cf_role');
    const cfUser  = localStorage.getItem('cf_username');

    // ── Auth guard ────────────────────────────────────
    if (!cfToken) { window.location.href = 'login.html'; }
    document.getElementById('headerUser').textContent = `👤 ${cfUser}`;
    if (cfRole === 'admin') document.getElementById('adminLink').style.display = '';

    function logout() { localStorage.clear(); window.location.href = 'login.html'; }
    function authHeaders() { return { 'Authorization': `Bearer ${cfToken}` }; }

    function displayType(type, subcategory) {
      const t = (type || '').toLowerCase();
      const s = (subcategory || '').toLowerCase().trim();
      const isSpecific = s && s !== 'other' && s !== 'unknown';
      const label = (t === 'other' && isSpecific) ? s : t;
      return label.replace(/_/g, ' ').replace(/\b\w/g, c => c.toUpperCase()) || '—';
    }

    function displayImageFinding(imageAnalysis) {
      const vu = imageAnalysis?.visual_understanding;
      const sub = (vu?.visual_subcategory || '').toLowerCase().trim();
      const isSpecific = sub && sub !== 'other' && sub !== 'unknown' && sub !== 'none';

      if (isSpecific) {
        return sub.replace(/_/g, ' ').replace(/\b\w/g, c => c.toUpperCase());
      }

      // If category is generic (other), show what the model actually saw.
      const caption = (imageAnalysis?.vlm_analysis?.caption || vu?.caption || '').trim();
      if (caption) {
        return caption;
      }

      return 'Processed';
    }

    // ── Load user's own complaints ────────────────────
    async function loadMyComplaints() {
      try {
        const res = await fetch(`${GATEWAY}/my-complaints?limit=30`, { headers: authHeaders() });
        if (!res.ok) throw new Error(await res.text());
        const d = await res.json();
        const list = document.getElementById('myComplaintsList');
        if (!d.complaints || d.complaints.length === 0) {
          list.innerHTML = '<p style="color:var(--gray-600);font-size:14px">You have not submitted any complaints yet.</p>';
          return;
        }
        const sevColor = { low:'var(--green)', medium:'var(--yellow)', high:'var(--orange)', critical:'var(--red)' };
        const rows = d.complaints.map(c => `
          <div style="display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;
                      padding:14px 0;border-bottom:1px solid var(--gray-200)">
            <div>
              <div style="display:flex;gap:8px;align-items:center;margin-bottom:4px">
                <code style="font-size:12px;color:var(--gray-600)">${c.id.slice(0,12)}…</code>
                <span style="font-size:11px;font-weight:700;text-transform:uppercase;
                             padding:2px 8px;border-radius:12px;background:var(--green-pale);color:var(--green)">
                  ${displayType(c.complaint_type, c.subcategory)}
                </span>
                ${c.duplicate_status && c.duplicate_status !== 'NEW' ? `<span style="font-size:11px;font-weight:700;text-transform:uppercase;padding:2px 8px;border-radius:12px;background:#fff3e0;color:#e65100">${c.duplicate_status.replace(/_/g,' ')}</span>` : ''}
              </div>
              <p style="font-size:13px;color:var(--gray-700);margin-bottom:3px">${c.text_preview || ''}</p>
              <span style="font-size:12px;color:var(--gray-600)">
                ${new Date(c.created_at).toLocaleString('en-GB',{dateStyle:'medium',timeStyle:'short'})}
                · Entity: <b>${c.assigned_entity || '—'}</b>
                · Severity: <b style="color:${sevColor[(c.severity||'').toLowerCase()]||'var(--gray-800)'}">${c.severity || '—'}</b>
              </span>
            </div>
            <button class="btn-track" style="white-space:nowrap" onclick="lookupId('${c.id}')">Details</button>
          </div>`).join('');
        list.innerHTML = `<div style="color:var(--gray-600);font-size:13px;margin-bottom:12px">${d.total} total complaint${d.total !== 1 ? 's' : ''}</div>${rows}`;
      } catch (e) {
        document.getElementById('myComplaintsList').innerHTML = `<p style="color:var(--red);font-size:14px">Failed to load: ${e.message}</p>`;
      }
    }

    // ── Lookup by ID ──────────────────────────────────
    function lookupId(id) {
      document.getElementById('trackId').value = id;
      document.getElementById('trackBtn').click();
    }

    document.getElementById('trackBtn').addEventListener('click', async () => {
      const id = document.getElementById('trackId').value.trim();
      if (!id) return;
      const box = document.getElementById('trackResult');
      const content = document.getElementById('trackContent');
      box.style.display = 'block';
      content.innerHTML = '<p style="color:#6C757D;padding:12px">⏳ Loading...</p>';
      try {
        const resp = await fetch(`${GATEWAY}/complaints/${encodeURIComponent(id)}`, { headers: authHeaders() });
        if (!resp.ok) throw new Error(`Not found (${resp.status})`);
        const d = await resp.json();
        content.innerHTML = renderComplaint(d);
      } catch (e) {
        content.innerHTML = `<p style="color:#C1121F;padding:12px">❌ ${e.message}</p>`;
      }
    });

    function renderComplaint(d) {
      const sev = d.severity || '—';
      const conf = Math.round((d.routing_confidence || 0) * 100);
      const isRejected = d.status === 'rejected';
      const moderationReason = d.moderation?.reason || '';
      const imageUploaded = !!(d.image_filename || d.image_id || d.image_analysis?.image_id);
      const pendingText = isRejected ? 'Skipped: rejected by moderation before this stage' : 'Pending';
      const steps = [
        { label: 'Text Understanding', done: !!d.text_analysis,
          detail: d.text_analysis
            ? `${displayType(d.text_analysis.issue_type || 'unknown', d.text_analysis.subcategory)} — ${d.text_analysis.detected_language || d.text_analysis.language || ''}`
            : (isRejected ? 'Skipped: moderation stopped the pipeline' : 'Not processed') },
        { label: 'Image Understanding', done: !!d.image_analysis?.image_present,
          detail: d.image_analysis?.image_present
            ? displayImageFinding(d.image_analysis)
            : (imageUploaded ? 'Image uploaded, analysis not run' : 'No image') },
        { label: 'Embedding + Similarity', done: !!d.embedding,
          detail: d.embedding ? `Strategy: ${d.embedding.fusion_strategy}` : pendingText },
        { label: 'Duplicate Detection', done: !!d.clustering,
          detail: d.clustering ? `${d.clustering.duplicate_status} · Cluster size: ${d.clustering.cluster_size}` : pendingText },
        { label: 'Priority Engine', done: !!d.priority,
          detail: d.priority ? `${sev} · Score: ${Math.round((d.priority_score||0)*100)}/100` : pendingText },
        { label: 'Routing Engine', done: !!d.routing,
          detail: d.routing ? `${d.assigned_entity} (${conf}% confidence)` : pendingText },
        { label: 'Explanation', done: !!d.explanation,
          detail: d.explanation?.explanation_text ? d.explanation.explanation_text.slice(0, 80) + '…' : pendingText },
      ];
      return `
        <div style="margin-bottom:16px">
          <h3 style="color:var(--green);font-size:16px">Complaint ${d.complaint_id?.slice(0,8)}…</h3>
          <span style="font-size:12px;color:var(--gray-600)">${d.created_at || ''} · Status: <b>${d.status || 'unknown'}</b></span>
        </div>
        <div style="background:white;border-radius:8px;padding:14px;margin-bottom:16px">
          <span style="font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--gray-600)">Original Text</span>
          <p style="font-size:14px;margin-top:6px;line-height:1.6">${d.original_text || ''}</p>
        </div>
        ${isRejected ? `
        <div style="background:#fde8ea;border:1px solid #f5b5bd;border-radius:8px;padding:12px 14px;margin-bottom:16px;font-size:13px;color:#8a1020">
          <strong>Rejected by moderation before pipeline processing.</strong>
          ${moderationReason ? `<div style="margin-top:6px">${moderationReason}</div>` : ''}
          ${imageUploaded ? `<div style="margin-top:6px;color:#6C757D">An image was uploaded, but image understanding did not run because moderation stopped the pipeline.</div>` : ''}
        </div>` : ''}
        ${d.status === 'contradiction' && d.media_validation?.contradiction_reason ? `
        <div style="background:#fff3cd;border:1px solid #ffc107;border-radius:8px;padding:12px 14px;margin-bottom:16px;font-size:13px;color:#856404">
          ⚠️ <strong>Contradiction detected:</strong> ${d.media_validation.contradiction_reason}
        </div>` : ''}
        <ul class="pipeline-steps">
          ${steps.map(s => `
            <li class="pipeline-step">
              <span class="step-status">${s.done ? '✅' : '⏸'}</span>
              <div class="step-info">
                <strong>${s.label}</strong>
                <span>${s.detail}</span>
              </div>
            </li>`).join('')}
        </ul>`;
    }

    // Init
    loadMyComplaints();
  </script>
</body>
</html>
