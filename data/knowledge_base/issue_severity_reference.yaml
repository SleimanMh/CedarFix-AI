# CedarFix AI — Issue Severity Reference
# Used by IEP-4 explanation service for RAG context retrieval
# Used by IEP-3 routing to boost priority score for high-severity incidents
# Severity scale: LOW | MEDIUM | HIGH | CRITICAL
# urgency_sla_hours: target dispatch time for responsive municipalities
# public_safety: if true, Civil Defense or ISF must be notified regardless of sector
# hitl_always: if true, never auto-route regardless of model confidence
# Sample Arabizi strings are authoring seeds for the corpus annotation team.

