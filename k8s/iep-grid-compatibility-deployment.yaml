apiVersion: v1
kind: ConfigMap
metadata:
  name: iep-grid-compatibility-config
  namespace: ev-platform
data:
  APP_ENV: "production"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: iep-grid-compatibility
  namespace: ev-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: iep-grid-compatibility
  template:
    metadata:
      labels:
        app: iep-grid-compatibility
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      containers:
        - name: iep-grid-compatibility
          image: ghcr.io/aliwaked-ai/project503n-iep-grid-compatibility:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8004
          envFrom:
            - configMapRef:
                name: iep-grid-compatibility-config
          livenessProbe:
            httpGet:
              path: /health
              port: 8004
            initialDelaySeconds: 45
            periodSeconds: 30
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /health
              port: 8004
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 5
          resources:
            requests:
              cpu: "50m"
              memory: "512Mi"
            limits:
              cpu: "200m"
              memory: "768Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: iep-grid-compatibility
  namespace: ev-platform
spec:
  selector:
    app: iep-grid-compatibility
  ports:
    - protocol: TCP
      port: 8004
      targetPort: 8004
  type: ClusterIP
