apiVersion: v1
kind: Service
metadata:
  name: ai-service
  namespace: cedarfix
spec:
  selector:
    app: ai-service
  ports:
    - name: text
      port: 8001
      targetPort: 8001
    - name: embedding
      port: 8003
      targetPort: 8003
    - name: matching
      port: 8004
      targetPort: 8004
    - name: routing
      port: 8006
      targetPort: 8006
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-service
  namespace: cedarfix
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: ai-service
  template:
    metadata:
      labels:
        app: ai-service
    spec:
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          command:
            - sh
            - -c
            - until nc -z postgres 5432; do echo waiting for postgres; sleep 2; done
        - name: wait-for-qdrant
          image: busybox:1.36
          command:
            - sh
            - -c
            - until nc -z qdrant 6333; do echo waiting for qdrant; sleep 2; done
      containers:
        - name: ai-service
          image: cedarfix-ai:latest
          imagePullPolicy: IfNotPresent
          command: ["python", "/app/docker/run_group.py"]
          args:
            - text=services.text_understanding.app.main:app:8001
            - embedding=services.embedding_service.app.main:app:8003
            - matching=services.clustering_service.app.main:app:8004
            - routing=services.routing_engine.app.main:app:8006
          ports:
            - name: text
              containerPort: 8001
            - name: embedding
              containerPort: 8003
            - name: matching
              containerPort: 8004
            - name: routing
              containerPort: 8006
          envFrom:
            - configMapRef:
                name: cedarfix-config
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: cedarfix-secrets
                  key: DATABASE_URL
            - name: QWEN_API_KEY
              valueFrom:
                secretKeyRef:
                  name: cedarfix-secrets
                  key: QWEN_API_KEY
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: cedarfix-secrets
                  key: OPENAI_API_KEY
          readinessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 30
            periodSeconds: 15
          resources:
            requests:
              cpu: "1"
              memory: 3Gi
            limits:
              cpu: "4"
              memory: 8Gi
