apiVersion: v1
kind: ConfigMap
metadata:
  name: iep-optimizer-config
  namespace: ev-platform
data:
  MLFLOW_TRACKING_URI: "http://mlflow:5000"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: iep-optimizer
  namespace: ev-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: iep-optimizer
  template:
    metadata:
      labels:
        app: iep-optimizer
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      containers:
        - name: iep-optimizer
          image: ghcr.io/aliwaked-ai/project503n-iep-optimizer:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8002
          envFrom:
            - configMapRef:
                name: iep-optimizer-config
          livenessProbe:
            httpGet:
              path: /health
              port: 8002
            initialDelaySeconds: 25
            periodSeconds: 30
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /health
              port: 8002
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 5
          resources:
            requests:
              cpu: "50m"
              memory: "320Mi"
            limits:
              cpu: "500m"
              memory: "768Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: iep-optimizer
  namespace: ev-platform
spec:
  selector:
    app: iep-optimizer
  ports:
    - protocol: TCP
      port: 8002
      targetPort: 8002
  type: ClusterIP
