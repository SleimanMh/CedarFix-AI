apiVersion: v1
kind: Service
metadata:
  name: vision-service
  namespace: cedarfix
spec:
  selector:
    app: vision-service
  ports:
    - name: vision
      port: 8002
      targetPort: 8002
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vision-service
  namespace: cedarfix
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: vision-service
  template:
    metadata:
      labels:
        app: vision-service
    spec:
      containers:
        - name: vision-service
          image: cedarfix-vision-ai:latest
          imagePullPolicy: IfNotPresent
          command: ["python", "/app/docker/run_group.py"]
          args:
            - vision=services.image_understanding.app.main:app:8002
          ports:
            - name: vision
              containerPort: 8002
          envFrom:
            - configMapRef:
                name: cedarfix-config
          env:
            - name: VLM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: cedarfix-secrets
                  key: VLM_API_KEY
          readinessProbe:
            httpGet:
              path: /health
              port: 8002
            initialDelaySeconds: 30
            periodSeconds: 15
          resources:
            requests:
              cpu: "500m"
              memory: 2Gi
            limits:
              cpu: "2"
              memory: 6Gi
          volumeMounts:
            - name: uploads
              mountPath: /data/uploads
            - name: hf-model-cache
              mountPath: /root/.cache/huggingface
      volumes:
        - name: uploads
          persistentVolumeClaim:
            claimName: uploads-pvc
        - name: hf-model-cache
          hostPath:
            path: /run/desktop/mnt/host/c/Users/sleim/Downloads/CedarFix AI/data/models
            type: Directory
