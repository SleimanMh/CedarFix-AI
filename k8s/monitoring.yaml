apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: ev-platform
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s
    scrape_configs:
      - job_name: "eep"
        metrics_path: /metrics
        static_configs:
          - targets: ["eep:8000"]
      - job_name: "iep-forecast"
        metrics_path: /metrics
        static_configs:
          - targets: ["iep-forecast:8001"]
      - job_name: "iep-optimizer"
        metrics_path: /metrics
        static_configs:
          - targets: ["iep-optimizer:8002"]
      - job_name: "iep-governance"
        metrics_path: /metrics
        static_configs:
          - targets: ["iep-governance:8003"]
      - job_name: "iep-grid-compatibility"
        metrics_path: /metrics
        static_configs:
          - targets: ["iep-grid-compatibility:8004"]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mlflow
  namespace: ev-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mlflow
  template:
    metadata:
      labels:
        app: mlflow
    spec:
      containers:
        - name: mlflow
          image: ghcr.io/mlflow/mlflow:latest
          imagePullPolicy: IfNotPresent
          command: ["mlflow"]
          args:
            - server
            - --host
            - 0.0.0.0
            - --port
            - "5000"
            - --backend-store-uri
            - sqlite:///mlflow.db
            - --default-artifact-root
            - /mlruns
            - --gunicorn-opts
            - --forwarded-allow-ips=*
          ports:
            - containerPort: 5000
          resources:
            requests:
              cpu: "50m"
              memory: "256Mi"
            limits:
              cpu: "200m"
              memory: "1536Mi"
          volumeMounts:
            - name: mlflow-data
              mountPath: /mlruns
      volumes:
        - name: mlflow-data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: mlflow
  namespace: ev-platform
spec:
  selector:
    app: mlflow
  ports:
    - protocol: TCP
      port: 5000
      targetPort: 5000
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: ev-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      containers:
        - name: prometheus
          image: prom/prometheus:latest
          imagePullPolicy: IfNotPresent
          args:
            - "--config.file=/etc/prometheus/prometheus.yml"
            - "--storage.tsdb.path=/prometheus"
          ports:
            - containerPort: 9090
          resources:
            requests:
              cpu: "25m"
              memory: "128Mi"
            limits:
              cpu: "100m"
              memory: "256Mi"
          volumeMounts:
            - name: prometheus-config
              mountPath: /etc/prometheus/prometheus.yml
              subPath: prometheus.yml
            - name: prometheus-data
              mountPath: /prometheus
      volumes:
        - name: prometheus-config
          configMap:
            name: prometheus-config
        - name: prometheus-data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: ev-platform
spec:
  selector:
    app: prometheus
  ports:
    - protocol: TCP
      port: 9090
      targetPort: 9090
  type: ClusterIP
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: ev-platform
data:
  prometheus.yml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        access: proxy
        url: http://prometheus:9090
        isDefault: true
        editable: false
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-provider
  namespace: ev-platform
data:
  default.yml: |
    apiVersion: 1
    providers:
      - name: EV Platform
        folder: EV Charging
        type: file
        options:
          path: /etc/grafana/dashboards
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-ev-platform
  namespace: ev-platform
data:
  ev_platform.json: |
    {
      "title": "EV Charging Platform",
      "uid": "ev-platform",
      "version": 1,
      "schemaVersion": 36,
      "refresh": "15s",
      "panels": [
        {
          "id": 1,
          "title": "Request Rate (req/s)",
          "type": "timeseries",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 0
          },
          "targets": [
            { "expr": "rate(http_requests_total{job=\"eep\"}[1m])", "legendFormat": "EEP" },
            { "expr": "rate(http_requests_total{job=\"iep-forecast\"}[1m])", "legendFormat": "Forecast" },
            { "expr": "rate(http_requests_total{job=\"iep-optimizer\"}[1m])", "legendFormat": "Optimizer" },
            { "expr": "rate(http_requests_total{job=\"iep-governance\"}[1m])", "legendFormat": "Governance" },
            { "expr": "rate(http_requests_total{job=\"iep-grid-compatibility\"}[1m])", "legendFormat": "GridCompat" }
          ]
        },
        {
          "id": 2,
          "title": "Latency p50 / p95 (seconds)",
          "type": "timeseries",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 0
          },
          "targets": [
            { "expr": "histogram_quantile(0.50, rate(http_request_duration_seconds_bucket{job=\"eep\"}[5m]))", "legendFormat": "EEP p50" },
            { "expr": "histogram_quantile(0.95, rate(http_request_duration_seconds_bucket{job=\"eep\"}[5m]))", "legendFormat": "EEP p95" },
            { "expr": "histogram_quantile(0.50, rate(http_request_duration_seconds_bucket{job=\"iep-optimizer\"}[5m]))", "legendFormat": "Optimizer p50" },
            { "expr": "histogram_quantile(0.95, rate(http_request_duration_seconds_bucket{job=\"iep-optimizer\"}[5m]))", "legendFormat": "Optimizer p95" },
            { "expr": "histogram_quantile(0.50, rate(http_request_duration_seconds_bucket{job=\"iep-forecast\"}[5m]))", "legendFormat": "Forecast p50" },
            { "expr": "histogram_quantile(0.95, rate(http_request_duration_seconds_bucket{job=\"iep-forecast\"}[5m]))", "legendFormat": "Forecast p95" },
            { "expr": "histogram_quantile(0.50, rate(http_request_duration_seconds_bucket{job=\"iep-governance\"}[5m]))", "legendFormat": "Governance p50" },
            { "expr": "histogram_quantile(0.95, rate(http_request_duration_seconds_bucket{job=\"iep-governance\"}[5m]))", "legendFormat": "Governance p95" },
            { "expr": "histogram_quantile(0.50, rate(http_request_duration_seconds_bucket{job=\"iep-grid-compatibility\"}[5m]))", "legendFormat": "GridCompat p50" },
            { "expr": "histogram_quantile(0.95, rate(http_request_duration_seconds_bucket{job=\"iep-grid-compatibility\"}[5m]))", "legendFormat": "GridCompat p95" }
          ]
        },
        {
          "id": 3,
          "title": "Error Rate by Service",
          "type": "timeseries",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 8
          },
          "targets": [
            { "expr": "rate(http_requests_total{job=\"eep\",status=~\"5..\"}[1m])", "legendFormat": "EEP 5xx" },
            { "expr": "rate(http_requests_total{job=\"iep-forecast\",status=~\"5..\"}[1m])", "legendFormat": "Forecast 5xx" },
            { "expr": "rate(http_requests_total{job=\"iep-optimizer\",status=~\"5..\"}[1m])", "legendFormat": "Optimizer 5xx" },
            { "expr": "rate(http_requests_total{job=\"iep-grid-compatibility\",status=~\"5..\"}[1m])", "legendFormat": "GridCompat 5xx" }
          ]
        },
        {
          "id": 4,
          "title": "Forecast Avg Predicted kW",
          "type": "timeseries",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 8
          },
          "targets": [
            { "expr": "ev_forecast_predicted_kw_avg", "legendFormat": "Avg Predicted kW" },
            { "expr": "ev_forecast_confidence_width_avg", "legendFormat": "Avg CI Width (kW)" }
          ]
        },
        {
          "id": 5,
          "title": "Optimizer Solver Status",
          "type": "timeseries",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 16
          },
          "targets": [
            { "expr": "rate(ev_optimizer_solves_total{status=\"optimal\"}[5m])", "legendFormat": "Optimal solves/s" },
            { "expr": "rate(ev_optimizer_solves_total{status=\"greedy_fallback\"}[5m])", "legendFormat": "Greedy fallbacks/s" }
          ]
        },
        {
          "id": 6,
          "title": "Optimizer Solve Time (s)",
          "type": "timeseries",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 16
          },
          "targets": [
            { "expr": "histogram_quantile(0.50, rate(ev_optimizer_solve_time_seconds_bucket[5m]))", "legendFormat": "p50 solve time" },
            { "expr": "histogram_quantile(0.95, rate(ev_optimizer_solve_time_seconds_bucket[5m]))", "legendFormat": "p95 solve time" }
          ]
        },
        {
          "id": 7,
          "title": "Governance: MAE vs Baseline",
          "type": "timeseries",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 24
          },
          "targets": [
            { "expr": "ev_governance_mae_kw", "legendFormat": "Rolling MAE (kW)" },
            { "expr": "ev_governance_mae_baseline_kw", "legendFormat": "Baseline MAE (kW)" }
          ]
        },
        {
          "id": 8,
          "title": "Drift Detection (PSI)",
          "type": "timeseries",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 24
          },
          "targets": [
            { "expr": "ev_governance_psi", "legendFormat": "PSI score" }
          ]
        }
      ]
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: ev-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      containers:
        - name: grafana
          image: grafana/grafana:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          resources:
            requests:
              cpu: "25m"
              memory: "256Mi"
            limits:
              cpu: "100m"
              memory: "512Mi"
          env:
            - name: GF_SECURITY_ADMIN_PASSWORD
              value: admin
            - name: GF_USERS_ALLOW_SIGN_UP
              value: "false"
          volumeMounts:
            - name: grafana-data
              mountPath: /var/lib/grafana
            - name: grafana-datasources
              mountPath: /etc/grafana/provisioning/datasources/prometheus.yml
              subPath: prometheus.yml
            - name: grafana-dashboard-provider
              mountPath: /etc/grafana/provisioning/dashboards/default.yml
              subPath: default.yml
            - name: grafana-dashboard-ev-platform
              mountPath: /etc/grafana/dashboards/ev_platform.json
              subPath: ev_platform.json
      volumes:
        - name: grafana-data
          emptyDir: {}
        - name: grafana-datasources
          configMap:
            name: grafana-datasources
        - name: grafana-dashboard-provider
          configMap:
            name: grafana-dashboard-provider
        - name: grafana-dashboard-ev-platform
          configMap:
            name: grafana-dashboard-ev-platform
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: ev-platform
spec:
  selector:
    app: grafana
  ports:
    - protocol: TCP
      port: 3000
      targetPort: 3000
  type: ClusterIP
