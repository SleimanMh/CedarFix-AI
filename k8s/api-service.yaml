apiVersion: v1
kind: Service
metadata:
  name: api-service
  namespace: cedarfix
spec:
  selector:
    app: api-service
  ports:
    - name: gateway
      port: 8000
      targetPort: 8000
    - name: priority
      port: 8005
      targetPort: 8005
    - name: explanation
      port: 8007
      targetPort: 8007
    - name: review
      port: 8008
      targetPort: 8008
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-service
  namespace: cedarfix
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: api-service
  template:
    metadata:
      labels:
        app: api-service
    spec:
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          command:
            - sh
            - -c
            - until nc -z postgres 5432; do echo waiting for postgres; sleep 2; done
      containers:
        - name: api-service
          image: cedarfix-api:latest
          imagePullPolicy: IfNotPresent
          command: ["python", "/app/docker/run_group.py"]
          args:
            - gateway=services.gateway.app.main:app:8000
            - priority=services.priority_engine.app.main:app:8005
            - explanation=services.explanation_service.app.main:app:8007
            - review=services.review_service.app.main:app:8008
          ports:
            - name: gateway
              containerPort: 8000
            - name: priority
              containerPort: 8005
            - name: explanation
              containerPort: 8007
            - name: review
              containerPort: 8008
          envFrom:
            - configMapRef:
                name: cedarfix-config
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: cedarfix-secrets
                  key: DATABASE_URL
            - name: JWT_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: cedarfix-secrets
                  key: JWT_SECRET_KEY
            - name: QWEN_API_KEY
              valueFrom:
                secretKeyRef:
                  name: cedarfix-secrets
                  key: QWEN_API_KEY
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: cedarfix-secrets
                  key: OPENAI_API_KEY
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: "250m"
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          volumeMounts:
            - name: uploads
              mountPath: /data/uploads
      volumes:
        - name: uploads
          persistentVolumeClaim:
            claimName: uploads-pvc
