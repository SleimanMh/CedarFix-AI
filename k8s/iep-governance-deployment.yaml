apiVersion: v1
kind: ConfigMap
metadata:
  name: iep-governance-config
  namespace: ev-platform
data:
  MLFLOW_TRACKING_URI: "http://mlflow:5000"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: iep-governance
  namespace: ev-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: iep-governance
  template:
    metadata:
      labels:
        app: iep-governance
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      containers:
        - name: iep-governance
          image: ghcr.io/aliwaked-ai/project503n-iep-governance:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8003
          envFrom:
            - configMapRef:
                name: iep-governance-config
          livenessProbe:
            httpGet:
              path: /health
              port: 8003
            initialDelaySeconds: 25
            periodSeconds: 30
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /health
              port: 8003
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 5
          resources:
            requests:
              cpu: "50m"
              memory: "128Mi"
            limits:
              cpu: "300m"
              memory: "768Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: iep-governance
  namespace: ev-platform
spec:
  selector:
    app: iep-governance
  ports:
    - protocol: TCP
      port: 8003
      targetPort: 8003
  type: ClusterIP
