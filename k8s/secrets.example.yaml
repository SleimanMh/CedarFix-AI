apiVersion: v1
kind: Secret
metadata:
  name: cedarfix-secrets
  namespace: cedarfix
type: Opaque
stringData:
  POSTGRES_USER: cedarfix
  POSTGRES_PASSWORD: cedarfix_secret
  POSTGRES_DB: cedarfix
  DATABASE_URL: postgresql://cedarfix:cedarfix_secret@postgres:5432/cedarfix
  JWT_SECRET_KEY: replace-with-a-long-random-production-secret
  QWEN_API_KEY: none
  VLM_API_KEY: none
  OPENAI_API_KEY: ""
