apiVersion: v1
kind: ConfigMap
metadata:
  name: eep-config
  namespace: ev-platform
data:
  MLFLOW_TRACKING_URI: "http://mlflow:5000"
  FORECAST_URL: "http://iep-forecast:8001"
  OPTIMIZER_URL: "http://iep-optimizer:8002"
  GOVERNANCE_URL: "http://iep-governance:8003"
  GRID_COMPAT_URL: "http://iep-grid-compatibility:8004"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: eep
  namespace: ev-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: eep
  template:
    metadata:
      labels:
        app: eep
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      containers:
        - name: eep
          image: ghcr.io/aliwaked-ai/project503n-eep:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: eep-config
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 5
          resources:
            requests:
              cpu: "50m"
              memory: "128Mi"
            limits:
              cpu: "200m"
              memory: "256Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: eep
  namespace: ev-platform
spec:
  selector:
    app: eep
  ports:
    - protocol: TCP
      port: 8000
      targetPort: 8000
  type: LoadBalancer
