apiVersion: v1
kind: ConfigMap
metadata:
  name: iep-forecast-config
  namespace: ev-platform
data:
  MLFLOW_TRACKING_URI: "http://mlflow:5000"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: iep-forecast
  namespace: ev-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: iep-forecast
  template:
    metadata:
      labels:
        app: iep-forecast
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      containers:
        - name: iep-forecast
          image: ghcr.io/aliwaked-ai/project503n-iep-forecast:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8001
          envFrom:
            - configMapRef:
                name: iep-forecast-config
          livenessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 5
          resources:
            requests:
              cpu: "50m"
              memory: "384Mi"
            limits:
              cpu: "300m"
              memory: "512Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: iep-forecast
  namespace: ev-platform
spec:
  selector:
    app: iep-forecast
  ports:
    - protocol: TCP
      port: 8001
      targetPort: 8001
  type: ClusterIP
