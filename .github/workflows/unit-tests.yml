name: gcp-fix unit tests

on:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  unit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-test.txt
          python -m pip install -e shared
      - name: Run unit tests with coverage gate
        run: |
          python -m pytest -q -m "not integration" --cov=shared --cov=services --cov=scripts --cov-report=term-missing --cov-fail-under=60
      - name: Run integration contract tests
        run: |
          python scripts/run_integration_tests.py
