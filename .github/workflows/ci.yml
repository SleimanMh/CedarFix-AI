name: CedarFix CI

on:
  push:
    branches: [main, cedarfix-dev]
  pull_request:
    branches: [main]

jobs:
  validate-and-test:
    name: Validate corpus & run unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate Arabizi vocabulary (optional — needs local dataset)
        run: |
          if [ -f scripts/validate_arabizi_vocabulary.py ]; then
            python scripts/validate_arabizi_vocabulary.py
          else
            echo "scripts/validate_arabizi_vocabulary.py not committed — skipping"
          fi

      - name: Validate CedarFix corpus (optional — needs local dataset)
        run: |
          if [ -f scripts/validate_cedarfix_corpus.py ]; then
            python scripts/validate_cedarfix_corpus.py
          else
            echo "scripts/validate_cedarfix_corpus.py not committed — skipping"
          fi

      - name: Validate OOV review queue (optional — needs local dataset)
        run: |
          if [ -f scripts/validate_arabizi_oov_queue.py ]; then
            python scripts/validate_arabizi_oov_queue.py
          else
            echo "scripts/validate_arabizi_oov_queue.py not committed — skipping"
          fi

      - name: Validate regression benchmark + SHA (optional — needs local dataset)
        run: |
          if [ -f scripts/validate_arabizi_benchmark.py ]; then
            python scripts/validate_arabizi_benchmark.py
          else
            echo "scripts/validate_arabizi_benchmark.py not committed — skipping"
          fi

      - name: Run deterministic unit tests (blocking gate)
        # Engineering-correctness gate: service contracts, routing, lifecycle,
        # multimodal fusion, calibration, and live observability. Self-contained
        # (src/ + committed fixtures only). test_suite.py is run separately in
        # the non-blocking research-benchmark job because it needs the local
        # Arabizi corpus that is intentionally not committed.
        run: |
          python -m unittest -v \
            scripts.tests.test_iep1_extraction_intelligence \
            scripts.tests.test_iep2_incident_intelligence \
            scripts.tests.test_iep3_routing \
            scripts.tests.test_iep3_routing_intelligence \
            scripts.tests.test_iep4_explanations \
            scripts.tests.test_iep5_lifecycle \
            scripts.tests.test_iep6_fusion_benchmark \
            scripts.tests.test_iep6_image_fusion \
            scripts.tests.test_iep7_calibration \
            scripts.tests.test_iep8_resolution \
            scripts.tests.test_iep8_grounding_benchmark \
            scripts.tests.test_iep8_advanced \
            scripts.tests.test_metrics_endpoints \
            scripts.tests.test_monitoring_metrics

  research-benchmarks:
    name: Arabizi research benchmarks (non-blocking)
    runs-on: ubuntu-latest
    needs: validate-and-test
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Arabizi corpus + quality-gate suite
        # Informational: depends on the local Arabizi corpus
        # (data/corpus/cedarfix_reports_v1.csv,
        #  data/eval/arabizi_benchmark_v0_regression.csv) which is not committed,
        # and on aspirational stability gates that are still being improved.
        # Tracked in reports/production_readiness_2026-06-01.md.
        run: python -m unittest test_suite -t scripts/tests || true

  docker-build:
    name: Build ${{ matrix.service.name }} image
    runs-on: ubuntu-latest
    needs:
      - validate-and-test
      - research-benchmarks
    strategy:
      matrix:
        service:
          - { name: eep,  dockerfile: src/eep/Dockerfile }
          - { name: iep1, dockerfile: src/iep1/Dockerfile }
          - { name: iep2, dockerfile: src/iep2/Dockerfile }
          - { name: iep3, dockerfile: src/iep3/Dockerfile }
          - { name: iep4, dockerfile: src/iep4/Dockerfile }
          - { name: iep5, dockerfile: src/iep5/Dockerfile }
          - { name: iep6, dockerfile: src/iep6/Dockerfile }
          - { name: iep7, dockerfile: src/iep7/Dockerfile }
          - { name: iep8, dockerfile: src/iep8/Dockerfile }
    steps:
      - uses: actions/checkout@v4

      - name: Check Dockerfile exists for ${{ matrix.service.name }}
        id: dockerfile-check
        run: |
          if [ -f "${{ matrix.service.dockerfile }}" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "Dockerfile ${{ matrix.service.dockerfile }} not yet created — skipping build"
          fi

      - name: Build ${{ matrix.service.name }}
        if: steps.dockerfile-check.outputs.exists == 'true'
        run: |
          docker build -f ${{ matrix.service.dockerfile }} \
            -t ghcr.io/${{ github.repository_owner }}/cedarfix-${{ matrix.service.name }}:${{ github.sha }} \
            .

      - name: Login to GHCR
        if: steps.dockerfile-check.outputs.exists == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push ${{ matrix.service.name }}
        if: steps.dockerfile-check.outputs.exists == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker tag \
            ghcr.io/${{ github.repository_owner }}/cedarfix-${{ matrix.service.name }}:${{ github.sha }} \
            ghcr.io/${{ github.repository_owner }}/cedarfix-${{ matrix.service.name }}:latest
          docker push ghcr.io/${{ github.repository_owner }}/cedarfix-${{ matrix.service.name }}:${{ github.sha }}
          docker push ghcr.io/${{ github.repository_owner }}/cedarfix-${{ matrix.service.name }}:latest
