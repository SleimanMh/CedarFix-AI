version: "3.9"

services:
  iep-forecast:
    build:
      context: .
      dockerfile: iep-forecast/Dockerfile
    ports:
      - "8001:8001"
    environment:
      - MLFLOW_TRACKING_URI=http://mlflow:5000
    volumes:
      - ./data/processed:/app/data/processed:ro
      - ./iep-forecast/models:/app/iep-forecast/models
    depends_on:
      - mlflow
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  iep-optimizer:
    build:
      context: .
      dockerfile: iep-optimizer/Dockerfile
    ports:
      - "8002:8002"
    environment:
      - MLFLOW_TRACKING_URI=http://mlflow:5000
    volumes:
      - ./data:/app/data:ro
    depends_on:
      - mlflow
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  iep-governance:
    build:
      context: .
      dockerfile: iep-governance/Dockerfile
    ports:
      - "8003:8003"
    environment:
      - MLFLOW_TRACKING_URI=http://mlflow:5000
      - FORECAST_URL=http://iep-forecast:8001
    volumes:
      - ./data/processed:/app/data/processed:ro
      - ./iep-forecast/models:/app/iep-forecast/models
    depends_on:
      - mlflow
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8003/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  iep-grid-compatibility:
    build:
      context: .
      dockerfile: iep-grid-compatibility/Dockerfile
    ports:
      - "8004:8004"
    volumes:
      - ./iep-grid-compatibility/models:/app/iep-grid-compatibility/models:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8004/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  eep:
    build:
      context: .
      dockerfile: eep/Dockerfile
    ports:
      - "8000:8000"
    environment:
      - MLFLOW_TRACKING_URI=http://mlflow:5000
      - FORECAST_URL=http://iep-forecast:8001
      - OPTIMIZER_URL=http://iep-optimizer:8002
      - GOVERNANCE_URL=http://iep-governance:8003
      - GRID_COMPAT_URL=http://iep-grid-compatibility:8004
    depends_on:
      iep-forecast:
        condition: service_healthy
      iep-optimizer:
        condition: service_healthy
      iep-governance:
        condition: service_healthy
      iep-grid-compatibility:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  mlflow:
    image: ghcr.io/mlflow/mlflow:latest
    ports:
      - "5000:5000"
    command: >
      mlflow server
      --host 0.0.0.0
      --port 5000
      --backend-store-uri sqlite:///mlflow.db
      --default-artifact-root /mlruns
      --gunicorn-opts "--forwarded-allow-ips='*'"
    volumes:
      - mlflow_data:/mlruns

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
    configs:
      - source: prometheus_config
        target: /etc/prometheus/prometheus.yml
    volumes:
      - prometheus_data:/prometheus

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus

configs:
  prometheus_config:
    content: |
      global:
        scrape_interval: 15s
      scrape_configs:
        - job_name: "eep"
          static_configs:
            - targets: ["eep:8000"]
        - job_name: "iep-forecast"
          static_configs:
            - targets: ["iep-forecast:8001"]
        - job_name: "iep-optimizer"
          static_configs:
            - targets: ["iep-optimizer:8002"]
        - job_name: "iep-governance"
          static_configs:
            - targets: ["iep-governance:8003"]
        - job_name: "iep-grid-compatibility"
          static_configs:
            - targets: ["iep-grid-compatibility:8004"]

volumes:
  mlflow_data:
  prometheus_data:
  grafana_data:
