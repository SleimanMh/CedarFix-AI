# =============================================================================
# CedarFix AI - compact local stack
#
# Default containers:
#   postgres, qdrant, frontend, api-service, ai-service, vision-service
#
# Optional monitoring:
#   docker compose --profile monitoring up
# =============================================================================

networks:
  cedarfix-net:
    driver: bridge

volumes:
  postgres_data:
  qdrant_data:
  mlflow_data:
  uploads_data:
  grafana_data:
  prometheus_data:

services:
  postgres:
    image: postgres:15-alpine
    container_name: cedarfix-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cedarfix}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cedarfix_secret}
      POSTGRES_DB: ${POSTGRES_DB:-cedarfix}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - cedarfix-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cedarfix"]
      interval: 10s
      timeout: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant:latest
    container_name: cedarfix-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - cedarfix-net
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/localhost/6333 && printf \"GET /healthz HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n\" >&3 && cat <&3 | grep -q 200' || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  api-service:
    image: cedarfix-api:latest
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    container_name: cedarfix-api-service
    command:
      - python
      - /app/docker/run_group.py
      - gateway=services.gateway.app.main:app:8000
      - priority=services.priority_engine.app.main:app:8005
      - explanation=services.explanation_service.app.main:app:8007
      - review=services.review_service.app.main:app:8008
    environment:
      DATABASE_URL: postgresql://cedarfix:cedarfix_secret@postgres:5432/cedarfix
      TEXT_SERVICE_URL: http://ai-service:8001
      IMAGE_SERVICE_URL: http://vision-service:8002
      EMBEDDING_SERVICE_URL: http://ai-service:8003
      CLUSTERING_SERVICE_URL: http://ai-service:8004
      PRIORITY_SERVICE_URL: http://localhost:8005
      ROUTING_SERVICE_URL: http://ai-service:8006
      EXPLANATION_SERVICE_URL: http://localhost:8007
      REVIEW_SERVICE_URL: http://localhost:8008
      MLFLOW_TRACKING_URI: http://mlflow:5000
      STORAGE_BACKEND: ${STORAGE_BACKEND:-local}
      GCS_BUCKET: ${GCS_BUCKET:-}
      UPLOADS_DIR: /data/uploads
      MODERATION_ENABLED: "true"
      MODERATION_LLM_THRESHOLD: "0.75"
      AUTO_BAN_SPAM_THRESHOLD: "10"
      NOMINATIM_URL: ""
      GOOGLE_MAPS_API_KEY: ${GOOGLE_MAPS_API_KEY:-}
      GOOGLE_GEOCODING_URL: ${GOOGLE_GEOCODING_URL:-https://maps.googleapis.com/maps/api/geocode/json}
      MULTI_COMPLAINT_SPLITTER_ENABLED: ${MULTI_COMPLAINT_SPLITTER_ENABLED:-true}
      MULTI_COMPLAINT_SPLITTER_LLM_ENABLED: ${MULTI_COMPLAINT_SPLITTER_LLM_ENABLED:-true}
      MULTI_COMPLAINT_SPLITTER_MAX_CHILDREN: ${MULTI_COMPLAINT_SPLITTER_MAX_CHILDREN:-5}
      MULTI_COMPLAINT_SPLITTER_TIMEOUT: ${MULTI_COMPLAINT_SPLITTER_TIMEOUT:-12}
      QWEN_BASE_URL: ${QWEN_BASE_URL:-http://host.docker.internal:8000/v1}
      QWEN_MODEL: ${QWEN_MODEL:-cedarfix}
      QWEN_API_KEY: ${QWEN_API_KEY:-none}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o}
      MEDIA_ALIGNMENT_LLM_ENABLED: ${MEDIA_ALIGNMENT_LLM_ENABLED:-true}
      MEDIA_ALIGNMENT_MODEL: ${MEDIA_ALIGNMENT_MODEL:-cedarfix}
      MEDIA_ALIGNMENT_API_KEY: ${MEDIA_ALIGNMENT_API_KEY:-none}
      MEDIA_ALIGNMENT_BASE_URL: ${MEDIA_ALIGNMENT_BASE_URL:-http://host.docker.internal:8000/v1}
      MEDIA_ALIGNMENT_TIMEOUT: ${MEDIA_ALIGNMENT_TIMEOUT:-20}
      MEDIA_ALIGNMENT_MIN_CONFIDENCE: ${MEDIA_ALIGNMENT_MIN_CONFIDENCE:-0.55}
      LLM_AUDIT_ENABLED: ${LLM_AUDIT_ENABLED:-true}
      LLM_AUDIT_GCS_ENABLED: ${LLM_AUDIT_GCS_ENABLED:-false}
      LLM_AUDIT_GCS_PREFIX: ${LLM_AUDIT_GCS_PREFIX:-llm-audit}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-cedarfix-dev-secret-change-in-prod}
      JWT_EXPIRE_HOURS: "24"
      PORT: "8000"
    ports:
      - "8000:8000"
      - "8005:8005"
      - "8007:8007"
      - "8008:8008"
    volumes:
      - uploads_data:/data/uploads
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started
    networks:
      - cedarfix-net

  ai-service:
    image: cedarfix-ai:latest
    build:
      context: .
      dockerfile: docker/ai.Dockerfile
    container_name: cedarfix-ai-service
    command:
      - python
      - /app/docker/run_group.py
      - text=services.text_understanding.app.main:app:8001
      - embedding=services.embedding_service.app.main:app:8003
      - matching=services.clustering_service.app.main:app:8004
      - routing=services.routing_engine.app.main:app:8006
    environment:
      DATABASE_URL: postgresql://cedarfix:cedarfix_secret@postgres:5432/cedarfix
      MLFLOW_TRACKING_URI: http://mlflow:5000
      LLM_AUDIT_ENABLED: ${LLM_AUDIT_ENABLED:-true}
      LLM_AUDIT_GCS_ENABLED: ${LLM_AUDIT_GCS_ENABLED:-false}
      LLM_AUDIT_GCS_PREFIX: ${LLM_AUDIT_GCS_PREFIX:-llm-audit}
      MODEL_NAME: sentence-transformers/paraphrase-multilingual-mpnet-base-v2
      QDRANT_HOST: qdrant
      QDRANT_PORT: "6333"
      QDRANT_URL: ${QDRANT_URL:-}
      QDRANT_API_KEY: ${QDRANT_API_KEY:-}
      QDRANT_TIMEOUT: "20"
      QDRANT_COLLECTION: complaints
      TEXT_EMBEDDING_DIM: "768"
      IMAGE_EMBEDDING_DIM: "512"
      FUSED_EMBEDDING_DIM: "768"
      ROUTING_QDRANT_COLLECTION: "routing_knowledge"
      ROUTING_RAG_ENABLED: "true"
      ROUTING_RAG_TOP_K: "8"
      MODEL_REGISTRY_NAME: cedarfix-routing
      AUTO_ROUTE_THRESHOLD: "0.85"
      REVIEW_THRESHOLD: "0.65"
      SIMILARITY_DUPLICATE_THRESHOLD: "0.92"
      SIMILARITY_NEAR_DUPLICATE_THRESHOLD: "0.78"
      HDBSCAN_MIN_CLUSTER_SIZE: "5"
      LLM_JUDGE_ENABLED: "true"
      LLM_JUDGE_TIMEOUT: "8"
      GOOGLE_MAPS_API_KEY: ${GOOGLE_MAPS_API_KEY:-}
      GOOGLE_GEOCODING_URL: ${GOOGLE_GEOCODING_URL:-https://maps.googleapis.com/maps/api/geocode/json}
      QWEN_BASE_URL: ${QWEN_BASE_URL:-http://host.docker.internal:8000/v1}
      QWEN_MODEL: ${QWEN_MODEL:-cedarfix}
      QWEN_API_KEY: ${QWEN_API_KEY:-none}
      QWEN_ENABLED: "true"
      QWEN_GUIDED: ${QWEN_GUIDED:-false}
      QWEN_TIMEOUT: ${QWEN_TIMEOUT:-50}
      QWEN_MAX_ATTEMPTS: ${QWEN_MAX_ATTEMPTS:-1}
      QWEN_MAX_TOKENS: ${QWEN_MAX_TOKENS:-1536}
      QWEN_ROUTING_TIMEOUT: ${QWEN_ROUTING_TIMEOUT:-20}
      QWEN_ROUTING_MAX_TOKENS: ${QWEN_ROUTING_MAX_TOKENS:-512}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: gpt-4o
    ports:
      - "8001:8001"
      - "8003:8003"
      - "8004:8004"
      - "8006:8006"
    volumes:
      - ./data/models:/root/.cache/huggingface
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started
    networks:
      - cedarfix-net

  vision-service:
    image: cedarfix-vision-ai:latest
    build:
      context: .
      dockerfile: docker/vision.Dockerfile
    container_name: cedarfix-vision-service
    command:
      - python
      - /app/docker/run_group.py
      - vision=services.image_understanding.app.main:app:8002
    environment:
      DATABASE_URL: postgresql://cedarfix:cedarfix_secret@postgres:5432/cedarfix
      MLFLOW_TRACKING_URI: http://mlflow:5000
      LLM_AUDIT_ENABLED: ${LLM_AUDIT_ENABLED:-true}
      LLM_AUDIT_GCS_ENABLED: ${LLM_AUDIT_GCS_ENABLED:-false}
      LLM_AUDIT_GCS_PREFIX: ${LLM_AUDIT_GCS_PREFIX:-llm-audit}
      CLIP_MODEL_NAME: openai/clip-vit-base-patch32
      VLM_BASE_URL: ${VLM_BASE_URL:-}
      VLM_MODEL: ${VLM_MODEL:-Qwen/Qwen2.5-VL-3B-Instruct}
      VLM_API_KEY: ${VLM_API_KEY:-none}
      VLM_ENABLED: "true"
      VLM_TIMEOUT: "25"
      STORAGE_BACKEND: ${STORAGE_BACKEND:-local}
      GCS_BUCKET: ${GCS_BUCKET:-}
      UPLOADS_DIR: /data/uploads
      PORT: "8002"
    ports:
      - "8002:8002"
    volumes:
      - ./data/models:/root/.cache/huggingface
      - uploads_data:/data/uploads
    networks:
      - cedarfix-net

  frontend:
    image: cedarfix-frontend:latest
    build:
      context: ./services/frontend
      dockerfile: Dockerfile
    container_name: cedarfix-frontend
    ports:
      - "80:80"
    depends_on:
      - api-service
    networks:
      - cedarfix-net

  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.12.1
    container_name: cedarfix-mlflow
    profiles: ["monitoring"]
    command: >
      bash -c "pip install --quiet --no-cache-dir psycopg2-binary &&
      mlflow server
      --backend-store-uri postgresql://cedarfix:cedarfix_secret@postgres:5432/cedarfix
      --default-artifact-root /mlflow/artifacts
      --host 0.0.0.0
      --port 5000"
    ports:
      - "5000:5000"
    volumes:
      - mlflow_data:/mlflow/artifacts
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - cedarfix-net

  prometheus:
    image: prom/prometheus:latest
    container_name: cedarfix-prometheus
    profiles: ["monitoring"]
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-lifecycle"
    ports:
      - "9090:9090"
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      - cedarfix-net

  grafana:
    image: grafana/grafana:latest
    container_name: cedarfix-grafana
    profiles: ["monitoring"]
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-cedarfix_grafana}
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infra/grafana/provisioning:/etc/grafana/provisioning
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards
    depends_on:
      - prometheus
    networks:
      - cedarfix-net

  monitoring-service:
    image: cedarfix-monitoring:latest
    build:
      context: .
      dockerfile: services/monitoring_service/Dockerfile
    container_name: cedarfix-monitoring-service
    profiles: ["monitoring"]
    command: uvicorn app.main:app --host 0.0.0.0 --port 8009
    environment:
      DATABASE_URL: postgresql://cedarfix:cedarfix_secret@postgres:5432/cedarfix
      MLFLOW_TRACKING_URI: http://mlflow:5000
      PROMETHEUS_URL: http://prometheus:9090
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o}
      EVALUATION_JUDGE_MODEL: ${EVALUATION_JUDGE_MODEL:-gpt-4o}
      EVALUATION_SCHEDULER_ENABLED: ${EVALUATION_SCHEDULER_ENABLED:-true}
      EVALUATION_RUN_ON_STARTUP: ${EVALUATION_RUN_ON_STARTUP:-false}
      EVALUATION_TIMEZONE: ${EVALUATION_TIMEZONE:-Asia/Beirut}
      EVALUATION_SAMPLE_RATE: ${EVALUATION_SAMPLE_RATE:-0.20}
      EVALUATION_BATCH_SIZE: ${EVALUATION_BATCH_SIZE:-4}
      EVALUATION_REQUEST_TIMEOUT: ${EVALUATION_REQUEST_TIMEOUT:-90}
      EVALUATION_BATCH_DELAY_SECONDS: ${EVALUATION_BATCH_DELAY_SECONDS:-20}
      EVALUATION_MAX_RETRIES: ${EVALUATION_MAX_RETRIES:-3}
      EVALUATION_MAX_TOKENS: ${EVALUATION_MAX_TOKENS:-4096}
      EVALUATION_INCLUDE_IMAGE_PARTS: ${EVALUATION_INCLUDE_IMAGE_PARTS:-false}
      EMBEDDING_DRIFT_THRESHOLD: "0.15"
      CORRECTION_RATE_ALERT_THRESHOLD: "0.15"
      PORT: "8009"
    ports:
      - "8009:8009"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - cedarfix-net
