# CedarFix Command AI — Docker Compose
# Services: postgres, redis, eep, iep1
# IEP-2 / IEP-3 / IEP-4 containers are added in subsequent phases.
#
# Usage:
#   copy .env.cedarfix.example .env.cedarfix
#   docker compose --env-file .env.cedarfix up --build

services:

  # ── Infrastructure ──────────────────────────────────────────────────────────
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    env_file:
      - path: .env.cedarfix
        required: false
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cedarfix}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cedarfix}
      POSTGRES_DB: ${POSTGRES_DB:-cedarfix}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cedarfix}"]
      interval: 5s
      timeout: 3s
      retries: 15
    ports:
      - "127.0.0.1:5432:5432"

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --save "" --appendonly no
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - "127.0.0.1:6379:6379"

  # ── Application services ────────────────────────────────────────────────────
  eep:
    build:
      context: .
      dockerfile: src/eep/Dockerfile
    restart: unless-stopped
    env_file:
      - path: .env.cedarfix
        required: false
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-cedarfix}:${POSTGRES_PASSWORD:-cedarfix}@postgres:5432/${POSTGRES_DB:-cedarfix}
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  iep1:
    build:
      context: .
      dockerfile: src/iep1/Dockerfile
    restart: unless-stopped
    env_file:
      - path: .env.cedarfix
        required: false
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-cedarfix}:${POSTGRES_PASSWORD:-cedarfix}@postgres:5432/${POSTGRES_DB:-cedarfix}
      REDIS_URL: redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:8001:8001"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8001/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  iep2:
    build:
      context: .
      dockerfile: src/iep2/Dockerfile
    restart: unless-stopped
    env_file:
      - path: .env.cedarfix
        required: false
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-cedarfix}:${POSTGRES_PASSWORD:-cedarfix}@postgres:5432/${POSTGRES_DB:-cedarfix}
      REDIS_URL: redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:8002:8002"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8002/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  iep3:
