apiVersion: v1
kind: Service
metadata:
  name: api-service
  namespace: cedarfix
spec:
  selector:
    app: api-service
  ports:
    - name: gateway
      port: 8000
      targetPort: 8000
    - name: priority
      port: 8005
      targetPort: 8005
    - name: explanation
      port: 8007
      targetPort: 8007
    - name: review
      port: 8008
      targetPort: 8008
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-service
  namespace: cedarfix
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-service
  template:
    metadata:
      labels:
        app: api-service
    spec:
      serviceAccountName: cedarfix-app
      containers:
        - name: api-service
          image: REGION-docker.pkg.dev/PROJECT_ID/cedarfix/cedarfix-api:latest
          imagePullPolicy: Always
          command: ["python", "/app/docker/run_group.py"]
          args:
            - gateway=services.gateway.app.main:app:8000
            - priority=services.priority_engine.app.main:app:8005
            - explanation=services.explanation_service.app.main:app:8007
            - review=services.review_service.app.main:app:8008
          ports:
            - name: gateway
              containerPort: 8000
            - name: priority
              containerPort: 8005
            - name: explanation
              containerPort: 8007
            - name: review
              containerPort: 8008
          envFrom:
            - configMapRef:
                name: cedarfix-config
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: cedarfix-secrets
                  key: DATABASE_URL
            - name: JWT_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: cedarfix-secrets
                  key: JWT_SECRET_KEY
            - name: QWEN_API_KEY
              valueFrom:
                secretKeyRef:
                  name: cedarfix-secrets
                  key: QWEN_API_KEY
            - name: VLM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: cedarfix-secrets
                  key: VLM_API_KEY
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: cedarfix-secrets
                  key: OPENAI_API_KEY
            - name: GOOGLE_MAPS_API_KEY
              valueFrom:
                secretKeyRef:
                  name: cedarfix-secrets
                  key: GOOGLE_MAPS_API_KEY
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests:
              cpu: "500m"
              memory: 768Mi
            limits:
              cpu: "2"
              memory: 2Gi
        - name: cloud-sql-proxy
          image: gcr.io/cloud-sql-connectors/cloud-sql-proxy:2.11.4
          args:
            - "--structured-logs"
            - "--port=5432"
            - "$(CLOUD_SQL_INSTANCE)"
          envFrom:
            - configMapRef:
                name: cedarfix-config
          securityContext:
            runAsNonRoot: true
          resources:
            requests:
              cpu: "100m"
              memory: 128Mi
            limits:
              cpu: "500m"
              memory: 512Mi
