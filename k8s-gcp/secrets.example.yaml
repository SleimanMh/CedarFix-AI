apiVersion: v1
kind: Secret
metadata:
  name: cedarfix-secrets
  namespace: cedarfix
type: Opaque
stringData:
  # Cloud SQL Auth Proxy sidecar exposes Postgres on 127.0.0.1:5432.
  DATABASE_URL: postgresql://cedarfix:STRONG_DB_PASSWORD@127.0.0.1:5432/cedarfix
  JWT_SECRET_KEY: replace-with-a-long-random-production-secret
  OPENAI_API_KEY: ""
  QWEN_API_KEY: none
  VLM_API_KEY: none
  QDRANT_API_KEY: ""
  GOOGLE_MAPS_API_KEY: ""
