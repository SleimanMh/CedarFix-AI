apiVersion: v1
kind: Service
metadata:
  name: ai-service
  namespace: cedarfix
spec:
  selector:
    app: ai-service
  ports:
    - name: text
      port: 8001
      targetPort: 8001
    - name: embedding
      port: 8003
      targetPort: 8003
    - name: matching
      port: 8004
      targetPort: 8004
    - name: routing
      port: 8006
      targetPort: 8006
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-service
  namespace: cedarfix
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: ai-service
  template:
    metadata:
      labels:
        app: ai-service
    spec:
      serviceAccountName: cedarfix-app
      containers:
        - name: ai-service
          image: us-central1-docker.pkg.dev/cedarfix/cedarfix/cedarfix-ai:latest
          imagePullPolicy: Always
          command: ["python", "/app/docker/run_group.py"]
          args:
            - text=services.text_understanding.app.main:app:8001
            - embedding=services.embedding_service.app.main:app:8003
            - matching=services.clustering_service.app.main:app:8004
            - routing=services.routing_engine.app.main:app:8006
          ports:
            - name: text
              containerPort: 8001
            - name: embedding
              containerPort: 8003
            - name: matching
              containerPort: 8004
            - name: routing
              containerPort: 8006
          envFrom:
            - configMapRef:
                name: cedarfix-config
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: cedarfix-secrets
                  key: DATABASE_URL
            - name: QWEN_API_KEY
              valueFrom:
                secretKeyRef:
                  name: cedarfix-secrets
                  key: QWEN_API_KEY
            - name: QDRANT_API_KEY
              valueFrom:
                secretKeyRef:
                  name: cedarfix-secrets
                  key: QDRANT_API_KEY
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: cedarfix-secrets
                  key: OPENAI_API_KEY
          readinessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 45
            periodSeconds: 15
          resources:
            requests:
              cpu: "750m"
              memory: 3Gi
            limits:
              cpu: "3"
              memory: 8Gi
        - name: cloud-sql-proxy
          image: gcr.io/cloud-sql-connectors/cloud-sql-proxy:2.11.4
          args:
            - "--structured-logs"
            - "--port=5432"
            - "$(CLOUD_SQL_INSTANCE)"
          envFrom:
            - configMapRef:
                name: cedarfix-config
          securityContext:
            runAsNonRoot: true
          resources:
            requests:
              cpu: "100m"
              memory: 128Mi
            limits:
              cpu: "500m"
              memory: 512Mi
