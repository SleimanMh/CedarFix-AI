apiVersion: v1
kind: Service
metadata:
  name: vision-service
  namespace: cedarfix
spec:
  selector:
    app: vision-service
  ports:
    - name: vision
      port: 8002
      targetPort: 8002
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vision-service
  namespace: cedarfix
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: vision-service
  template:
    metadata:
      labels:
        app: vision-service
    spec:
      serviceAccountName: cedarfix-app
      containers:
        - name: vision-service
          image: us-central1-docker.pkg.dev/cedarfix/cedarfix/cedarfix-vision-ai:latest
          imagePullPolicy: Always
          command: ["python", "/app/docker/run_group.py"]
          args:
            - vision=services.image_understanding.app.main:app:8002
          ports:
            - name: vision
              containerPort: 8002
          envFrom:
            - configMapRef:
                name: cedarfix-config
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: cedarfix-secrets
                  key: DATABASE_URL
            - name: VLM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: cedarfix-secrets
                  key: VLM_API_KEY
          readinessProbe:
            httpGet:
              path: /health
              port: 8002
            initialDelaySeconds: 45
            periodSeconds: 15
          resources:
            requests:
              cpu: "500m"
              memory: 2Gi
            limits:
              cpu: "2"
              memory: 6Gi
        - name: cloud-sql-proxy
          image: gcr.io/cloud-sql-connectors/cloud-sql-proxy:2.11.4
          args:
            - "--structured-logs"
            - "--port=5432"
            - "$(CLOUD_SQL_INSTANCE)"
          envFrom:
            - configMapRef:
                name: cedarfix-config
          securityContext:
            runAsNonRoot: true
          resources:
            requests:
              cpu: "100m"
              memory: 128Mi
            limits:
              cpu: "500m"
              memory: 256Mi
