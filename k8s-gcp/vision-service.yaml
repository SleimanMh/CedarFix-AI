apiVersion: v1
kind: Service
metadata:
  name: vision-service
  namespace: cedarfix
spec:
  selector:
    app: vision-service
  ports:
    - name: vision
      port: 8002
      targetPort: 8002
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vision-service
  namespace: cedarfix
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vision-service
  template:
    metadata:
      labels:
        app: vision-service
    spec:
      serviceAccountName: cedarfix-app
      containers:
        - name: vision-service
          image: REGION-docker.pkg.dev/PROJECT_ID/cedarfix/cedarfix-vision-ai:latest
          imagePullPolicy: Always
          command: ["python", "/app/docker/run_group.py"]
          args:
            - vision=services.image_understanding.app.main:app:8002
          ports:
            - name: vision
              containerPort: 8002
          envFrom:
            - configMapRef:
                name: cedarfix-config
          env:
            - name: VLM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: cedarfix-secrets
                  key: VLM_API_KEY
          readinessProbe:
            httpGet:
              path: /health
              port: 8002
            initialDelaySeconds: 45
            periodSeconds: 15
          resources:
            requests:
              cpu: "1"
              memory: 3Gi
            limits:
              cpu: "4"
              memory: 10Gi
