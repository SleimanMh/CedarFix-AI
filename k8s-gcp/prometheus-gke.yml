global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'gateway'
    static_configs:
      - targets: ['api-service:8000']
    metrics_path: /metrics

  - job_name: 'priority-engine'
    static_configs:
      - targets: ['api-service:8005']
    metrics_path: /metrics

  - job_name: 'explanation-service'
    static_configs:
      - targets: ['api-service:8007']
    metrics_path: /metrics

  - job_name: 'review-service'
    static_configs:
      - targets: ['api-service:8008']
    metrics_path: /metrics

  - job_name: 'text-understanding'
    static_configs:
      - targets: ['ai-service:8001']
    metrics_path: /metrics

  - job_name: 'embedding-service'
    static_configs:
      - targets: ['ai-service:8003']
    metrics_path: /metrics

  - job_name: 'incident-matching-service'
    static_configs:
      - targets: ['ai-service:8004']
    metrics_path: /metrics

  - job_name: 'routing-engine'
    static_configs:
      - targets: ['ai-service:8006']
    metrics_path: /metrics

  - job_name: 'image-understanding'
    static_configs:
      - targets: ['vision-service:8002']
    metrics_path: /metrics
