[pytest]
testpaths = .
addopts =
    --strict-markers
    --strict-config
markers =
    unit: fast deterministic unit tests
    contract: static contracts for schemas, data, manifests, and config files
    integration: tests requiring running external services
    e2e: end-to-end tests that exercise multiple running services
    slow: tests that are too slow for the default unit suite
    qdrant: tests requiring a live Qdrant instance
    db: tests requiring a database
    model: tests requiring ML model packages or downloads
filterwarnings =
    ignore::DeprecationWarning
